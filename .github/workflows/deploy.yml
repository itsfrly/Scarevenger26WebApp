name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Two deploys at once means a CloudFormation conflict. Queue instead.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to request the OIDC token

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deliberately no `environment:`. Declaring one rewrites the OIDC subject
    # claim to `...:environment:<name>` and drops the branch ref, which the
    # IAM trust policy matches on. Branch restriction would then have to come
    # from a GitHub deployment-branch policy instead — splitting one security
    # property across two systems.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      # TEMPORARY: prints the exact subject GitHub is sending so it can be
      # compared against the IAM trust policy. Delete once OIDC works.
      - name: Show OIDC subject claim
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # base64url -> base64, pad to a multiple of 4
          PAYLOAD=$(echo "$PAYLOAD" | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "sub: $(echo "$PAYLOAD" | base64 -d | jq -r .sub)"
          echo "aud: $(echo "$PAYLOAD" | base64 -d | jq -r .aud)"

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1

      # Reads the live stack outputs, so the bundle is built against the real
      # user pool. Requires the stack to already exist -- the first deploy in
      # a fresh account is done locally.
      - name: Generate frontend env from stack outputs
        run: npx tsx backend/scripts/write-frontend-env.ts

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Deploy
        working-directory: infra
        env:
          # Everything else comes from infra/cdk.json, so a local deploy and a
          # CI deploy cannot disagree. Only the cert ARN is held back, because
          # it contains the AWS account id.
          SCAREVENGER_CERT_ARN: ${{ secrets.CERT_ARN }}
        run: npx cdk deploy --require-approval never
